name: proyecto_1
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Selector de imagen (foto de mascota)
  image_picker: ^1.1.2

  # Generador de QR
  qr_flutter: ^4.1.0

  # Generador de Word (.docx)
  docx_template: ^0.4.0

  # Guardar archivos en el dispositivo
  path_provider: ^2.1.4

  # Abrir archivos (el Word generado)
  open_filex: ^4.5.0

  # Permisos en Android
  permission_handler: ^11.3.1

  # Formateo de fechas
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/